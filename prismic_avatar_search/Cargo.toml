[package]
name = "prismic_avatar_search"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.26"
egui_extras = "0.26"
env_logger = "0.11"
flume = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
open = "5.1"
regex = "1.11"
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
